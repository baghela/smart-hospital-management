services:
  db:
    image: postgres:16-alpine
    container_name: hospital-db
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital
    ports:
      - "5432:5432"
    volumes:
      - hospital_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: hospital-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://hospital:hospital@db:5432/hospital
    command: >
      sh -c "alembic upgrade head && python -m data.seed.seed_data"
    restart: "no"

  api:
    build: .
    container_name: hospital-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://hospital:hospital@db:5432/hospital
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ui:
    build: .
    container_name: hospital-ui
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://hospital:hospital@db:5432/hospital
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped

volumes:
  hospital_pgdata:

